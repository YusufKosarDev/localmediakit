name: CI

on:
  push:
  pull_request:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Java 21, Maven)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and test
        # Tests run against in-memory H2 (no Docker/Testcontainers, no secrets),
        # so the suite is self-contained on a clean runner. The Postgres-tagged
        # tests are excluded here and run in their own job below.
        run: mvn -B --no-transfer-progress verify

  postgres:
    name: Backend against real PostgreSQL
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Its own job rather than part of the main one. H2's PostgreSQL
      # compatibility mode is a good trade for a suite that has to finish in a
      # minute, but it is a compatibility mode, and this project has already
      # paid for believing it: V17 exists because a migration behaved
      # differently against real data on a real server. These few tests cover
      # the places where the database itself is what is being tested -- the
      # migrations, the hand-written native SQL, and the constraint errors the
      # retry logic depends on -- and leave the rest on H2 where it belongs.
      # Clearing surefire.excluded.groups is what actually lets these run:
      # excludedGroups wins over -Dgroups, so selecting the tag is not enough
      # to un-exclude it. Without the second flag this job runs nothing and
      # reports success, which is how a suite quietly stops testing anything.
      - name: Run the Postgres-tagged tests
        run: mvn -B --no-transfer-progress test -Dgroups=postgres -Dsurefire.excluded.groups=

  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      # pnpm before setup-node: the node cache resolves the pnpm store path,
      # which only exists once pnpm is on PATH. The version comes from the
      # packageManager field, and the path has to be spelled out because
      # defaults.run does not apply to actions -- only to run steps.
      - uses: pnpm/action-setup@v6.0.9
        with:
          package_json_file: frontend/package.json

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm run build
