name: E2E

# Runs alongside the main CI rather than inside it. The unit suites answer in
# about ninety seconds and that fast feedback is worth protecting; booting a
# backend, a production frontend build and a browser takes several minutes, so
# it gets its own job and does not delay the quick answer.
on:
  push:
  pull_request:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright (local stack)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # pnpm before setup-node, so the cache can resolve the pnpm store. The
      # version comes from frontend/package.json's packageManager field.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      # Only Chromium: these tests are about whether the stack works together,
      # not about browser differences. A second engine would double the time
      # and catch nothing this project is likely to get wrong.
      - name: Install Chromium
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium

      # Playwright starts both servers itself, but the frontend must already be
      # built: the tests exercise the static public page and its on-demand
      # revalidation, neither of which behaves like production under `next dev`.
      - name: Build frontend
        working-directory: frontend
        run: pnpm run build

      - name: Package backend
        run: mvn -B -q --no-transfer-progress -f backend/pom.xml -DskipTests package

      - name: Run end-to-end tests
        working-directory: frontend
        run: pnpm exec playwright test

      - name: Publish report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 14
