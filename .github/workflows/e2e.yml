name: E2E

# Runs alongside the main CI rather than inside it. The unit suites answer in
# about ninety seconds and that fast feedback is worth protecting; booting a
# backend, a production frontend build and a browser takes several minutes, so
# it gets its own job and does not delay the quick answer.
on:
  push:
  pull_request:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright (local stack)
    # Pinned, not "latest", and the visual tests are the reason.
    #
    # A screenshot baseline carries the font rasterisation of the machine that
    # made it. That is the objection that kept pixel testing out of this
    # project, and it is correct about baselines made on a laptop: they differ
    # on every glyph edge from the moment they are committed. It is answered by
    # generating them where they are compared -- here -- not by giving up.
    #
    # "latest" would then reintroduce it on GitHub's schedule instead of on
    # anyone's decision: the day the label moves to a new image, a font package
    # changes underneath the baselines and every visual test goes red for a
    # reason that has nothing to do with this repository. Pinning makes that an
    # edit somebody makes on purpose, with the baselines regenerated in the same
    # commit.
    #
    # Playwright's own container image would be stricter still and is the usual
    # advice. It is not used here because this job also builds and runs a Spring
    # backend, and putting a JDK into that image is a larger change than the
    # remaining risk justifies.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6.0.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # pnpm before setup-node, so the cache can resolve the pnpm store. The
      # version comes from frontend/package.json's packageManager field.
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      # Only Chromium: these tests are about whether the stack works together,
      # not about browser differences. A second engine would double the time
      # and catch nothing this project is likely to get wrong.
      - name: Install Chromium
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium

      # Playwright starts both servers itself, but the frontend must already be
      # built: the tests exercise the static public page and its on-demand
      # revalidation, neither of which behaves like production under `next dev`.
      - name: Build frontend
        working-directory: frontend
        run: pnpm run build

      - name: Package backend
        run: ./backend/mvnw -B -q --no-transfer-progress -f backend/pom.xml -DskipTests package

      - name: Run end-to-end tests
        working-directory: frontend
        run: pnpm exec playwright test

      - name: Publish report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 14

      # A visual test with no baseline writes one and fails, which is Playwright
      # telling you it had nothing to compare against. That written file is the
      # baseline, produced on the machine that will do the comparing, so it is
      # collected here to be committed rather than regenerated on a laptop --
      # which is the whole reason these tests were avoided before.
      - name: Publish any snapshots this run had to create
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: visual-baselines
          path: frontend/e2e/**/*-snapshots/**
          if-no-files-found: ignore
          retention-days: 14
