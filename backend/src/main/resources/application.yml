# Default profile = local development (H2 in-memory, zero setup).
# H2 runs in PostgreSQL compatibility mode so the same Flyway migrations run
# locally and in production. Production (Render + Neon) uses application-prod.yml.
spring:
  datasource:
    # Driver is auto-detected from the URL prefix (jdbc:h2 locally, jdbc:postgresql
    # in prod). Do NOT pin driver-class-name here or it leaks into the prod profile.
    url: jdbc:h2:mem:localmediakit;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  # SMTP for lead notifications. Blank host = feature off (graceful-enable).
  # Any provider works: these are the standard SMTP settings, so switching
  # vendor never touches code. Credentials live only in the environment.
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  jpa:
    # Flyway owns the schema; Hibernate never generates or alters DDL.
    hibernate:
      ddl-auto: none
    open-in-view: false
  flyway:
    enabled: true
    # Adopt Flyway on a database that may already contain tables (the Step 0
    # 'kits' table created before Flyway): baseline instead of failing.
    baseline-on-migrate: true

server:
  port: ${PORT:8080}
  # Never expose internals in error responses.
  error:
    include-stacktrace: never
    include-message: never
  # gzip API/JSON responses over the wire.
  compression:
    enabled: true
    mime-types: application/json,text/plain,text/css,application/javascript
    min-response-size: 1024

management:
  endpoints:
    web:
      exposure:
        # health is public (the platform's uptime check calls it). prometheus is
        # NOT: SecurityConfig permits only /actuator/health, so scraping needs a
        # session token. That is the safe default rather than the convenient one
        # — an open metrics endpoint tells a stranger how much this service is
        # used and when it is failing. A real deployment would move the
        # management endpoints to their own port (management.server.port) and
        # leave that port off the public interface entirely.
        include: health,prometheus
  health:
    mail:
      # Adding the mail starter auto-registers a health indicator that opens an
      # SMTP connection. Lead notifications are an optional integration, so an
      # unconfigured (or briefly unreachable) provider must not make the whole
      # application report DOWN — the platform restarts on a failed health
      # check, which would turn a dark feature into an outage.
      enabled: false

app:
  # Absolute base for every link this backend hands out: the dashboard link in a
  # lead notification email and the Stripe return URLs. One property, because
  # both are the same fact — when it lived in two places (app.frontend-url and
  # app.billing.frontend-url) only one of them was ever defined, and the reader
  # of the other silently fell back to a hard-coded default. No trailing slash.
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  # The "local-dev-" prefix on the secrets below is load-bearing, not decorative:
  # ProductionSecretsCheck refuses to start the prod profile while any of them
  # still carries it. Keep the prefix on every new development default, and never
  # commit a real value here.
  #
  # Frontend on-demand revalidation target. Overridden by env vars in every real
  # environment; the secret must NEVER be committed with a real value.
  revalidate:
    url: ${REVALIDATE_URL:http://localhost:3000/api/revalidate}
    secret: ${REVALIDATE_SECRET:local-dev-secret}
  jwt:
    # HS256 requires >= 32 bytes. Overridden by JWT_SECRET in every real environment.
    secret: ${JWT_SECRET:local-dev-jwt-secret-change-me-at-least-32-bytes-long}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:720}
  scheduled-publish:
    # The interval is the worst-case lateness a creator sees: a page set for
    # 09:00 that goes live at 09:59 has missed the point of being scheduled.
    job-interval-ms: ${SCHEDULED_PUBLISH_JOB_INTERVAL_MS:60000}
    job-initial-delay-ms: ${SCHEDULED_PUBLISH_JOB_INITIAL_DELAY_MS:30000}
  password-reset:
    # Same lifetime as a draft preview link. Long enough to find the mail,
    # short enough that a link left in an inbox stops being a key.
    ttl-minutes: ${PASSWORD_RESET_TTL_MINUTES:30}
    # Per account, not per client: the IP throttle covers volume, this covers
    # using many clients to bury one person in mail.
    max-per-hour: ${PASSWORD_RESET_MAX_PER_HOUR:5}
  preview:
    # Lifetime of a signed draft-preview link (minutes).
    ttl-minutes: ${PREVIEW_TTL_MINUTES:30}
  cors:
    # Comma-separated list of allowed browser origins (the dashboard).
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  analytics:
    # Salts the anonymous visitor fingerprint (sha256 of ip|ua|day|salt).
    # Override with a real value in production so hashes are not guessable.
    salt: ${ANALYTICS_SALT:local-dev-analytics-salt}
    # How long individual view rows are kept before they are folded into one
    # row per kit per day. Lifetime totals are unaffected (they read the rollup
    # plus the window); the referrer and device breakdowns become "this window"
    # rather than "all time", which is the deliberate cost of not storing every
    # visit forever. 90 days is well past the point anyone acts on a referrer.
    retention-days: ${ANALYTICS_RETENTION_DAYS:90}
    retention-batch-size: ${ANALYTICS_RETENTION_BATCH_SIZE:200}
    # Views age into eligibility a day at a time, so an hourly pass would spend
    # most of its runs finding nothing.
    retention-job-interval-ms: ${ANALYTICS_RETENTION_JOB_INTERVAL_MS:21600000}
    retention-job-initial-delay-ms: ${ANALYTICS_RETENTION_JOB_INITIAL_DELAY_MS:120000}
  ratelimit:
    # In-memory token buckets per client IP (per minute). Disabled in tests.
    enabled: ${RATELIMIT_ENABLED:true}
    login-capacity: ${RATELIMIT_LOGIN:10}
    register-capacity: ${RATELIMIT_REGISTER:30}
    track-capacity: ${RATELIMIT_TRACK:120}
    unlock-capacity: ${RATELIMIT_UNLOCK:20}
    contact-capacity: ${RATELIMIT_CONTACT:10}
    # Password/email change and account deletion — each verifies the current
    # password, so an unthrottled endpoint would be a credential oracle.
    account-capacity: ${RATELIMIT_ACCOUNT:10}
  demo:
    # Seed/reset the login-able demo account and purge @test.dev accounts.
    seed-on-startup: ${DEMO_SEED_ON_STARTUP:true}
    reset-cron: ${DEMO_RESET_CRON:0 0 * * * *}
    # Shared, publicly-advertised login. Destructive settings operations are
    # refused on it so a visitor cannot lock everyone else out or delete it.
    email: ${DEMO_EMAIL:demo@localmediakit.app}
  domains:
    # DNS verification job (custom-domain skeleton). Intervals in ms.
    job-interval-ms: ${DOMAIN_JOB_INTERVAL_MS:60000}
    job-initial-delay-ms: ${DOMAIN_JOB_INITIAL_DELAY_MS:30000}
    recheck-interval-ms: ${DOMAIN_RECHECK_INTERVAL_MS:60000}
    max-attempts: ${DOMAIN_MAX_ATTEMPTS:30}
    dns-timeout-ms: ${DOMAIN_DNS_TIMEOUT_MS:3000}
    dns-retries: ${DOMAIN_DNS_RETRIES:1}
    verify-host-prefix: ${DOMAIN_VERIFY_HOST_PREFIX:_localmediakit-verify}
  notifications:
    # Lead notification emails. Graceful-enable: with spring.mail.host or
    # app.mail.from blank the feature is dark — nothing is queued and nothing
    # is sent. Provider-neutral, so switching vendor is env-only.
    hourly-cap: ${NOTIFY_HOURLY_CAP:12}
    batch-size: ${NOTIFY_BATCH_SIZE:20}
    job-interval-ms: ${NOTIFY_JOB_INTERVAL_MS:60000}
    job-initial-delay-ms: ${NOTIFY_JOB_INITIAL_DELAY_MS:20000}
  mail:
    from: ${MAIL_FROM:}
    from-name: ${MAIL_FROM_NAME:LocalMediaKit}
  youtube:
    # YouTube Data API v3 key. Graceful-enable: blank = the YouTube sync
    # feature stays dark (connect answers 503, no UI is offered).
    api-key: ${YOUTUBE_API_KEY:}
    api-base-url: ${YOUTUBE_API_BASE_URL:https://www.googleapis.com/youtube/v3}
  statsync:
    # Scheduled refresh of connected stat sources. The batch ticks hourly but a
    # source is only fetched when last_synced_at is older than sync-interval-ms.
    job-interval-ms: ${STATSYNC_JOB_INTERVAL_MS:3600000}
    job-initial-delay-ms: ${STATSYNC_JOB_INITIAL_DELAY_MS:45000}
    sync-interval-ms: ${STATSYNC_INTERVAL_MS:86400000}
    manual-cooldown-ms: ${STATSYNC_MANUAL_COOLDOWN_MS:60000}
    http-timeout-ms: ${STATSYNC_HTTP_TIMEOUT_MS:5000}
  stripe:
    # TEST MODE keys only; real values live in the host's env, never in the repo.
    # With the dummy default, checkout answers 503 (billing not configured).
    secret-key: ${STRIPE_SECRET_KEY:sk_test_dummy}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:whsec_test_dummy}
    price-id: ${STRIPE_PRICE_ID:price_dummy}
