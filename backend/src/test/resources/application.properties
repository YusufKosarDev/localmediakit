# Test-only overrides (added on top of the main application.yml, not replacing it).
# Rate limiting and demo seeding would interfere with the fast test suite, so
# both are off here; dedicated tests re-enable rate limiting with tiny limits.
app.ratelimit.enabled=false
app.demo.seed-on-startup=false
# Stats sync: no manual cooldown (tests drive syncs back to back) and a huge
# initial delay so the scheduled batch never fires inside a test context —
# tests call runSyncBatch() directly. Zero switches the throttle off outright;
# the throttle itself is covered by StatsSyncCooldownTest, which sets a real one.
app.statsync.manual-cooldown-ms=0
app.statsync.job-initial-delay-ms=3600000

# The same silence for the other two scheduled batches, and for the same reason.
# Their production defaults (20s and 30s) were chosen on the assumption that a
# test context is short-lived; that assumption expires as the suite grows. Once
# a context outlives the delay, the scheduler fires a batch that races the one
# the test drives by hand, and the overlap guard turns the test's own call into
# a no-op — a failure that reads as a broken outbox and is really a clock.
# Tests invoke runDispatchBatch() and the domain job directly, so nothing here
# needs them to fire on their own.
app.notifications.job-initial-delay-ms=3600000
app.domains.job-initial-delay-ms=3600000
app.analytics.retention-job-initial-delay-ms=3600000
