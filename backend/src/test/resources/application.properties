# Test-only overrides (added on top of the main application.yml, not replacing it).
# Rate limiting and demo seeding would interfere with the fast test suite, so
# both are off here; dedicated tests re-enable rate limiting with tiny limits.
app.ratelimit.enabled=false
app.demo.seed-on-startup=false
# Stats sync: no manual cooldown (tests drive syncs back to back). Zero switches
# the throttle off outright; the throttle itself is covered by
# StatsSyncCooldownTest, which sets a real one.
app.statsync.manual-cooldown-ms=0

# The scheduler is off for the whole suite.
#
# This replaces the per-job initial delays that used to be listed here one at a
# time, each pushed to an hour to keep a scheduled batch from racing the one a
# test drives by hand. That was the right diagnosis and the wrong shape: the
# list had to be extended by hand for every new job, and it was already two
# short -- the password-reset dispatcher and, when it arrived, the email-change
# one -- which is exactly how the race came back.
#
# The race is also worse than one context's scheduler against its own tests.
# Spring caches an application context per distinct test configuration, and the
# datasource is a single named in-memory database with DB_CLOSE_DELAY=-1, so
# every cached context in this JVM talks to the SAME database. A job ticking in
# a context left over from an earlier class will drain an outbox the class
# currently running is asserting on, through that older context's mail sender --
# which may well be a mock somebody stubbed as available. The failure cannot
# happen when a class is run alone and appears intermittently in the full suite,
# naming whichever test lost the race.
#
# Nothing is given up. No test here asks whether Spring can call a method on a
# timer; they invoke the batches directly, which is also the only way to assert
# on what a batch actually did.
app.scheduling.enabled=false
